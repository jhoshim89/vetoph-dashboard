<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>수의안과 데이터 대시보드</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo',sans-serif;
    background:#fafaf9;color:#1f2937;margin:0;min-height:100vh;
    display:flex;flex-direction:column;justify-content:center;padding:40px 20px}
  .wrap{max-width:760px;margin:0 auto;width:100%}
  h1{font-size:26px;margin:0 0 6px;color:#111827;letter-spacing:-.3px}
  .sub{color:#6b7280;font-size:14px;margin-bottom:32px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{display:block;text-decoration:none;background:#fff;border:1px solid #e5e7eb;border-radius:16px;
    padding:28px 24px;transition:border-color .15s,transform .15s;color:inherit}
  .card:hover{border-color:#0070f3;transform:translateY(-2px)}
  .card .icon{font-size:34px;margin-bottom:14px}
  .card .t{font-size:18px;font-weight:700;color:#111827;margin-bottom:6px}
  .card .d{font-size:13.5px;color:#6b7280;line-height:1.5}
  .foot{margin-top:32px;font-size:12px;color:#9ca3af}
  @media(max-width:560px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>수의안과 논문 데이터</h1>
  <div class="sub">InsightsOphVet · 보고 싶은 걸 골라 들어가세요</div>
  <div class="cards">
    <a class="card" href="pipeline.html">
      <div class="icon">📥</div>
      <div class="t">수집·처리 현황</div>
      <div class="d">PDF 받기 → 파싱 → Supabase·Qdrant 적재까지 파이프라인 흐름과 출처별 현황</div>
    </a>
    <a class="card" href="content.html">
      <div class="icon">📊</div>
      <div class="t">데이터 내용</div>
      <div class="d">검증된 안과 논문 8천여 편의 종·주제별 구성과 원문·요약 채움률</div>
    </a>
  </div>
  <div class="foot">맥 스튜디오 켜져 있을 때 자동 갱신 · URL 비공개</div>
</div>
</body>
</html>
